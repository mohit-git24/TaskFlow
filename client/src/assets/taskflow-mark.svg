<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Removed grain filter to fix lag -->
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFAFF" />
      <stop offset="1" stop-color="#F6F3FF" />
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="1200" height="800" rx="28" fill="url(#paper)" />

  <!-- ruled lines -->
  <g opacity="0.35">
    <path d="M120 220H1080" stroke="#2D243A" stroke-opacity="0.14" stroke-width="2" />
    <path d="M120 310H1080" stroke="#2D243A" stroke-opacity="0.14" stroke-width="2" />
    <path d="M120 400H1080" stroke="#2D243A" stroke-opacity="0.14" stroke-width="2" />
    <path d="M120 490H1080" stroke="#2D243A" stroke-opacity="0.14" stroke-width="2" />
    <path d="M120 580H1080" stroke="#2D243A" stroke-opacity="0.14" stroke-width="2" />
  </g>

  <!-- checklist boxes -->
  <g>
    <rect x="160" y="250" width="34" height="34" rx="8" stroke="#2D243A" stroke-opacity="0.45" stroke-width="2" />
    <rect x="160" y="340" width="34" height="34" rx="8" stroke="#2D243A" stroke-opacity="0.45" stroke-width="2" />
    <rect x="160" y="430" width="34" height="34" rx="8" stroke="#2D243A" stroke-opacity="0.45" stroke-width="2" />
    <rect x="160" y="520" width="34" height="34" rx="8" stroke="#2D243A" stroke-opacity="0.45" stroke-width="2" />
  </g>

  <!-- checkmarks (accent ink) -->
  <g stroke="#7A2CFF" stroke-opacity="0.78" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 267L176 275L186 260" />
    <path d="M170 447L176 455L186 440" />
    <path d="M170 537L176 545L186 530" />
  </g>

  <!-- writing strokes -->
  <g stroke="#2D243A" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <path d="M230 268C310 250 400 252 480 268" />
    <path d="M230 357C340 340 470 342 590 360" />
    <path d="M230 447C360 430 520 432 700 450" />
    <path d="M230 537C330 520 460 520 590 538" />
  </g>

  <!-- margin rule -->
  <path d="M214 190V630" stroke="#7A2CFF" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round" />

  <!-- subtle grain overlay (disabled) -->
  <g opacity="0.35">
    <rect x="0" y="0" width="1200" height="800" rx="28" fill="transparent" />
  </g>
</svg>
